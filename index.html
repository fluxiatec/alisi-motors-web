      .wm { position: fixed; inset: 0; z-index: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; user-select: none; }
      .wm__in { position: relative; display: flex; flex-direction: column; align-items: center; }
      /* Logo: isotipo rojo + ALISI MOTORS en blanco (mismas proporciones que el logo de marca). */
      .wm__iso { display: block; width: clamp(7rem, 40vw, 20rem); height: auto; color: #ee1c1c; animation: wm-fade 1.4s cubic-bezier(.2, .7, .2, 1) both; }
      .wm__word {
        margin: .9em 0 0;
        padding-left: .2em; /* compensa el tracking del último caracter para que quede centrado */
        font: 400 clamp(1.5rem, 9vw, 4.5rem) / 1 'Anton Wordmark', Anton, Impact, 'Arial Narrow', sans-serif;
        letter-spacing: .2em;
        color: #fff;
        white-space: nowrap;
        animation: wm-in 1.6s cubic-bezier(.2, .7, .2, 1) both;
      }
      .wm__tag {
        position: absolute; left: 0; right: 0; top: 100%; margin: .9rem 0 0;
        font: 500 .72rem/1.4 system-ui, sans-serif; letter-spacing: .42em; text-transform: uppercase; text-align: center; color: rgb(255 255 255 / .7);
        animation: wm-fade 1s ease-out .7s both;
      }
      /* .01 y no 0: el texto cuenta como pintado desde el primer frame (LCP), visualmente es negro. */
      @keyframes wm-in { from { opacity: .01; letter-spacing: .3em; } to { opacity: 1; letter-spacing: .2em; } }
      @keyframes wm-fade { from { opacity: 0; } to { opacity: 1; } }
      @media (min-width: 640px) { .wm__tag { font-size: .8rem; } }
      @media (prefers-reduced-motion: reduce) { .wm__iso, .wm__word, .wm__tag { animation: none; } }
