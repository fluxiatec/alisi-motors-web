# /etc/nginx/sites-available/alisimotors.com
# Ubuntu 24.04: sudo apt install nginx libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static certbot python3-certbot-nginx
# Certificado: sudo certbot --nginx -d alisimotors.com -d www.alisimotors.com

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name alisimotors.com www.alisimotors.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://alisimotors.com$request_uri; }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.alisimotors.com;
    ssl_certificate     /etc/letsencrypt/live/alisimotors.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alisimotors.com/privkey.pem;
    return 301 https://alisimotors.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alisimotors.com;

    root /var/www/alisimotors/dist;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/alisimotors.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alisimotors.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/alisi-headers.conf;

    # Compresión: brotli + gzip para texto. Imágenes y videos ya vienen comprimidos.
    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

    types {
        image/avif avif;
        application/manifest+json webmanifest;
    }

    # JS/CSS/fuentes con hash de Vite → caché inmutable de 1 año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/alisi-headers.conf;
        try_files $uri =404;
    }

    # Fotos y videos optimizados (sin hash en el nombre → 30 días).
    # Range requests: nginx las soporta de fábrica en archivos estáticos (Accept-Ranges: bytes),
    # necesarias para que Safari/iOS reproduzca los MP4. No comprimir ni bufferear los videos.
    location /media/ {
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/alisi-headers.conf;
        add_header Accept-Ranges bytes always;
        gzip off;
        brotli off;
        sendfile on;
        tcp_nopush on;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|svg|ico|webmanifest|woff2)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include snippets/alisi-headers.conf;
        try_files $uri =404;
    }

    # El HTML siempre se revalida para tomar el deploy nuevo.
    location / {
        add_header Cache-Control "no-cache" always;
        include snippets/alisi-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
